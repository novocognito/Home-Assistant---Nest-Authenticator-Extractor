<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      margin: 0;
      background-color: #f8f9fa;
      color: #202124;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 16px;
      color: #03a9f4;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .field-group {
      margin-bottom: 14px;
    }
    label {
      font-weight: bold;
      font-size: 12px;
      display: block;
      margin-bottom: 4px;
      color: #5f6368;
    }
    textarea {
      width: 100%;
      height: 60px;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 11px;
      padding: 6px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      resize: vertical;
      background: #fff;
    }
    button {
      margin-top: 4px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      color: #fff;
      background-color: #03a9f4;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0288d1;
    }
    button.clear-btn {
      background-color: #757575;
      font-size: 10px;
      padding: 3px 8px;
    }
    button.clear-btn:hover {
      background-color: #616161;
    }
    .status {
      font-size: 11px;
      color: #2e7d32;
      margin-left: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <h3>
    Nest Auth Extractor
    <button id="clear-btn" class="clear-btn">Clear Saved</button>
  </h3>

  <div class="field-group">
    <label for="issue-token">issueToken Request URL:</label>
    <textarea id="issue-token" readonly placeholder="Sign in at home.nest.com to capture..."></textarea>
    <button id="copy-token-btn">Copy Request URL</button>
    <span id="token-status" class="status">Copied!</span>
  </div>

  <div class="field-group">
    <label for="cookie-header">oauth2/iframe Cookie Header Value:</label>
    <textarea id="cookie-header" readonly placeholder="Sign in at home.nest.com to capture..."></textarea>
    <button id="copy-cookie-btn">Copy Cookie Header</button>
    <span id="cookie-status" class="status">Copied!</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
